<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy AI Assistant</title>
    <style>
        :root {
            --primary: #f59e0b;
            --primary-dark: #d97706;
            --primary-glow: rgba(245, 158, 11, 0.3);
            --accent: #06b6d4;
            --accent-glow: rgba(6, 182, 212, 0.3);
            --bg: #030f1a;
            --bg-card: #0a1929;
            --bg-surface: #0d2137;
            --bg-input: #071520;
            --text: #e2e8f0;
            --text-muted: #475569;
            --text-dim: #94a3b8;
            --border: rgba(6, 182, 212, 0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px;
            background-image:
                radial-gradient(ellipse at 15% 15%, rgba(245, 158, 11, 0.04) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 85%, rgba(6, 182, 212, 0.06) 0%, transparent 55%);
        }

        .chat-wrapper {
            width: 100%;
            max-width: 1200px;
            height: 95vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border-radius: 20px;
            box-shadow:
                0 0 0 1px var(--border),
                0 24px 64px rgba(0, 0, 0, 0.6),
                0 0 100px rgba(6, 182, 212, 0.04);
            overflow: hidden;
        }

        /* ── Header ── */
        .chat-header {
            background: linear-gradient(135deg, #071520 0%, #0a1929 100%);
            color: white;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .chat-header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, var(--primary) 30%, var(--accent) 70%, transparent 100%);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 18px var(--primary-glow);
            flex-shrink: 0;
        }

        .header-title h1 {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.2px;
        }

        .header-subtitle {
            font-size: 10px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 500;
            margin-top: 1px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-status {
            font-size: 12px;
            color: var(--accent);
            padding: 5px 12px;
            background: rgba(6, 182, 212, 0.08);
            border: 1px solid rgba(6, 182, 212, 0.25);
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 4px var(--accent); }
            50% { opacity: 0.4; box-shadow: none; }
        }

        .model-selector select {
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(6, 182, 212, 0.06);
            color: var(--text-dim);
            font-size: 12px;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s, color 0.2s;
        }

        .model-selector select:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .model-selector select option {
            background: var(--bg-card);
            color: var(--text);
        }

        /* ── Messages ── */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .messages-container::-webkit-scrollbar { width: 4px; }
        .messages-container::-webkit-scrollbar-track { background: transparent; }
        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(6, 182, 212, 0.2);
            border-radius: 4px;
        }
        .messages-container::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        .message {
            display: flex;
            animation: slideIn 0.28s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .message.user      { justify-content: flex-end; }
        .message.assistant { justify-content: flex-start; }

        .message-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            word-wrap: break-word;
            line-height: 1.65;
            font-size: 14.5px;
        }

        .user .message-bubble {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: #050f1a;
            font-weight: 500;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.28);
        }

        .assistant .message-bubble {
            background: var(--bg-surface);
            color: var(--text);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        /* ── Typing ── */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 14px 18px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            width: fit-content;
        }

        .typing-indicator span {
            width: 7px;
            height: 7px;
            background: var(--accent);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { opacity: 0.25; transform: scale(0.75); }
            30%           { opacity: 1;    transform: scale(1); }
        }

        /* ── Input ── */
        .input-area {
            border-top: 1px solid var(--border);
            padding: 14px 20px;
            background: var(--bg-card);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 8px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0 16px;
            align-items: center;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.08);
        }

        #prompt-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14.5px;
            padding: 12px 0;
            background: transparent;
            color: var(--text);
            font-family: inherit;
            resize: none;
            max-height: 100px;
        }

        #prompt-input::placeholder { color: var(--text-muted); }

        #send-button {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: #050f1a;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            transition: transform 0.15s, box-shadow 0.15s;
            flex-shrink: 0;
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        #send-button:hover:not(:disabled) {
            transform: scale(1.07);
            box-shadow: 0 6px 22px rgba(245, 158, 11, 0.5);
        }

        #send-button:active:not(:disabled) { transform: scale(0.94); }

        #send-button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        /* ── Empty state ── */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 16px;
        }

        .empty-state-icon {
            width: 88px;
            height: 88px;
            background: linear-gradient(135deg, rgba(245,158,11,0.08), rgba(6,182,212,0.08));
            border: 1px solid var(--border);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            box-shadow: 0 0 50px rgba(6, 182, 212, 0.08), 0 0 30px rgba(245, 158, 11, 0.06);
        }

        .empty-state-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
        }

        .empty-state-desc {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            max-width: 320px;
            line-height: 1.7;
        }

        .suggestion-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 520px;
            margin-top: 4px;
        }

        .chip {
            padding: 7px 15px;
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-dim);
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s, background 0.2s;
            background: rgba(6, 182, 212, 0.04);
            user-select: none;
        }

        .chip:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(245, 158, 11, 0.07);
        }

        /* ── Error ── */
        .error-message {
            background: rgba(239, 68, 68, 0.08);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            border-left: 3px solid #ef4444;
            max-width: 80%;
        }

        /* ── Mobile ── */
        @media (max-width: 600px) {
            .chat-wrapper { height: 100vh; border-radius: 0; }
            .message-bubble { max-width: 88%; }
            .header-title h1 { font-size: 15px; }
            .suggestion-chips { display: none; }
        }
    </style>
</head>
<body>
    <div class="chat-wrapper">

        <div class="chat-header">
            <div class="header-left">
                <div class="header-icon">⚡</div>
                <div class="header-title">
                    <h1>Energy AI Assistant</h1>
                    <div class="header-subtitle">Power &amp; Energy Intelligence</div>
                </div>
            </div>
            <div class="header-right">
                <div class="model-selector">
                    <select id="model-select">
                        <option value="phi-3">Loading models...</option>
                    </select>
                </div>
                <div class="header-status">
                    <span class="status-dot"></span>
                    Online
                </div>
            </div>
        </div>

        <div class="messages-container" id="messages-container">
            <div class="empty-state">
                <div class="empty-state-icon">⚡</div>
                <div class="empty-state-title">Energy AI Assistant</div>
                <div class="empty-state-desc">Ask me anything about energy systems, power markets, renewables, or climate topics.</div>
                <div class="suggestion-chips">
                    <span class="chip" onclick="askChip(this)">How does solar power work?</span>
                    <span class="chip" onclick="askChip(this)">Energy market trends</span>
                    <span class="chip" onclick="askChip(this)">Nuclear vs renewables</span>
                    <span class="chip" onclick="askChip(this)">Grid stability challenges</span>
                    <span class="chip" onclick="askChip(this)">Carbon pricing mechanisms</span>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input
                    type="text"
                    id="prompt-input"
                    placeholder="Ask about energy, power markets, or climate..."
                    autocomplete="off"
                >
            </div>
            <button id="send-button" title="Send message">⚡</button>
        </div>

    </div>

    <script src="/static/chat.js"></script>
    <script>
        function askChip(el) {
            const input = document.getElementById('prompt-input');
            input.value = el.textContent;
            input.focus();
        }
    </script>
</body>
</html>
